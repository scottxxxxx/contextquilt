openapi: "3.0.3"
info:
  title: ContextQuilt API
  version: "3.14.0"
  description: >
    Persistent cognitive memory layer for AI applications. ContextQuilt gives
    your AI app memory that persists across sessions, platforms, and conversations.
  contact:
    email: scott@contextquilt.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8000
    description: Local development

tags:
  - name: Hot Path
    description: Low-latency context recall and cache operations
  - name: Memory
    description: Asynchronous memory ingestion
  - name: Quilt
    description: Patch CRUD and graph visualization
  - name: Projects
    description: Project management for grouping patches
  - name: Authentication
    description: Application registration and token issuance
  - name: Ops
    description: Operational health and readiness

security:
  - AppIdHeader: []
  - BearerJWT: []

components:
  securitySchemes:
    AppIdHeader:
      type: apiKey
      in: header
      name: X-App-ID
      description: Application identifier issued during registration.
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JSON Web Token obtained from POST /v1/auth/token.

  schemas:
    RecallRequest:
      type: object
      required: [user_id, text]
      properties:
        user_id:
          type: string
          description: Unique user identifier (e.g. Apple Sign-In UUID).
        text:
          type: string
          description: The query or prompt to recall context for.
        metadata:
          type: object
          properties:
            project:
              type: string
            project_id:
              type: string
        max_hops:
          type: integer
          default: 2
          description: Maximum graph traversal hops for entity matching.

    RecallResponse:
      type: object
      properties:
        context:
          type: string
          description: Formatted context block ready for injection into an LLM prompt.
        matched_entities:
          type: array
          items:
            type: string
        patch_count:
          type: integer

    MemoryRequest:
      type: object
      required: [user_id, interaction_type]
      properties:
        user_id:
          type: string
        interaction_type:
          type: string
          enum: [tool_call, trace, chat_log, meeting_summary, meeting_transcript, query]
        summary:
          type: string
        content:
          type: string
        response:
          type: string
        metadata:
          $ref: "#/components/schemas/MemoryMetadata"
        timestamp:
          type: string
          format: date-time

    MemoryMetadata:
      type: object
      description: >
        App-defined key-value bag. CQ accepts arbitrary keys and stores them
        alongside extracted facts. Some keys are reserved — CQ interprets them
        per the contract below. Apps may still add any additional keys.
      additionalProperties: true
      properties:
        user_label:
          type: string
          description: Hard claim of which transcript speaker is the submitting user.
        user_identified:
          type: boolean
          description: True only when the app has a hard identity claim (e.g., voice match).
        identification_source:
          type: string
          enum: [enrollment, user_confirmation, none]
          description: Source of the identity claim. CQ honors the claim when non-"none".
        owner_speaker_label:
          type: string
          description: Legacy server-side marker injection. New integrators use user_label.
        display_name:
          type: string
          description: Fallback for user-context when no (you) marker is present.
        subscription_tier:
          type: string
          enum: [free, plus, pro]
        previous_tier:
          type: string
          enum: [free, plus, pro]
          description: Set only when a tier boundary was crossed in the previous 24h.
        user_attribution_hint:
          $ref: "#/components/schemas/UserAttributionHint"

    UserAttributionHint:
      type: object
      description: >
        Soft-signal attribution from the app's identity layer when no hard
        `user_identified=true` claim is available. See
        docs/architecture/05-integration.md for the full gating contract.
        Omit the field entirely (do not send null) when the sender can't
        compute a hint.
      required: [speaker_label, confidence, confidence_basis]
      properties:
        speaker_label:
          type: string
          description: Must match a Speaker N label that appears in the request's transcript.
        confidence:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        confidence_basis:
          type: string
          enum: [enrolled_similarity, cumulative_seconds, embedding_consistency, combined]
          description: >
            How the confidence was computed. `combined` is a sender-side blend
            CQ treats as opaque. See integration docs for individual basis
            semantics.
        secondary_candidate:
          type: object
          description: Second-best guess. `confidence` must be <= primary confidence.
          required: [speaker_label, confidence]
          properties:
            speaker_label:
              type: string
            confidence:
              type: number
              format: float
              minimum: 0.0
              maximum: 1.0

    MemoryResponse:
      type: object
      properties:
        status:
          type: string
          example: queued
        message:
          type: string

    EnrichRequest:
      type: object
      required: [user_id, template]
      properties:
        user_id:
          type: string
        template:
          type: string
          description: Prompt template with {{variable}} placeholders.
        context:
          type: object
        format:
          type: string
          enum: [text, json]

    EnrichResponse:
      type: object
      properties:
        enriched_prompt:
          type: string
        variables:
          type: object
        used_variables:
          type: array
          items:
            type: string
        missing_variables:
          type: array
          items:
            type: string

    ProfileResponse:
      type: object
      properties:
        user_id:
          type: string
        variables:
          type: object

    PatchConnection:
      type: object
      properties:
        to_patch_id:
          type: string
        role:
          type: string
        label:
          type: string
        context:
          type: string

    QuiltPatch:
      type: object
      properties:
        patch_id:
          type: string
        fact:
          type: string
        category:
          type: string
        patch_type:
          type: string
        source:
          type: string
        owner:
          type: string
          nullable: true
        deadline:
          type: string
          nullable: true
        project:
          type: string
          nullable: true
        project_id:
          type: string
          nullable: true
        meeting_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        connections:
          type: array
          items:
            $ref: "#/components/schemas/PatchConnection"

    QuiltResponse:
      type: object
      properties:
        user_id:
          type: string
        facts:
          type: array
          items:
            $ref: "#/components/schemas/QuiltPatch"
        action_items:
          type: array
          items:
            $ref: "#/components/schemas/QuiltPatch"
        deleted:
          type: array
          items:
            type: string
          description: Patch IDs deleted since the `since` timestamp (only present for delta sync).
        server_time:
          type: string
          format: date-time
          description: Use as the `since` value on the next delta-sync call.

    PatchCreateRequest:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          enum: [trait, preference, identity, role, person, project, decision, commitment, blocker, takeaway]
          description: Patch type.
        text:
          type: string
          description: The patch content.
        owner:
          type: string
          nullable: true
          description: Owner name (for commitment, blocker, decision).
        project_id:
          type: string
          nullable: true
          description: Project UUID to scope this patch to.
        connections:
          type: array
          items:
            type: object
            required: [target_patch_id, role]
            properties:
              target_patch_id:
                type: string
              role:
                type: string
                enum: [parent, depends_on, resolves, replaces, informs]
              label:
                type: string
              context:
                type: string

    PatchCreateResponse:
      type: object
      properties:
        status:
          type: string
          example: created
        patch_id:
          type: string
        type:
          type: string
        connections:
          type: array
          items:
            type: object
            properties:
              to:
                type: string
              role:
                type: string
              label:
                type: string

    PatchUpdateRequest:
      type: object
      properties:
        fact:
          type: string
        category:
          type: string

    PatchUpdateResponse:
      type: object
      properties:
        status:
          type: string
          example: updated
        patch_id:
          type: string

    PatchDeleteResponse:
      type: object
      properties:
        status:
          type: string
          example: deleted
        patch_id:
          type: string

    UserDeleteResponse:
      type: object
      properties:
        status:
          type: string
          example: deleted
        user_id:
          type: string
        patches_deleted:
          type: integer
        entities_deleted:
          type: integer

    RenameSpeakerRequest:
      type: object
      required: [old_name, new_name]
      properties:
        old_name:
          type: string
        new_name:
          type: string

    RenameSpeakerResponse:
      type: object
      properties:
        status:
          type: string
          example: renamed
        old_name:
          type: string
        new_name:
          type: string

    FromLabel:
      type: object
      required: [label, meeting_id]
      properties:
        label:
          type: string
        meeting_id:
          type: string
          description: The meeting UUID, stored as origin_id.

    ReassignSpeakerRequest:
      type: object
      required: [from_labels]
      description: >
        Exactly one of to_person_id, to_name or to_self. Every from_label
        carries its own meeting, so the request is meeting scoped.
      properties:
        from_labels:
          type: array
          items:
            $ref: "#/components/schemas/FromLabel"
        to_person_id:
          type: string
          nullable: true
        to_name:
          type: string
          nullable: true
          description: >
            Name a speaker CQ has no id for. Resolved or created server
            side, through the same path POST /v1/people uses. Diarization
            placeholders are refused (422 PLACEHOLDER_NAME).
        to_self:
          type: boolean
          nullable: true

    ReassignSpeakerResponse:
      type: object
      properties:
        patches_updated:
          type: integer
        connections_updated:
          type: integer
        entities_merged:
          type: integer
        labels_skipped:
          type: integer
        appearances_recorded:
          type: integer
          description: >
            Speaker-capacity person_appearances rows written or merged
            into, dated by the meeting's ingest clock.
        presence_entity_id:
          type: string
          nullable: true
          description: >
            Where presence landed. Null when a to_self call found no ego
            link to hang it on.
        resolved_person:
          type: object
          nullable: true
          description: Present for to_name, null otherwise.
          properties:
            entity_id:
              type: string
            name:
              type: string
            patch_id:
              type: string
              nullable: true
            status:
              type: string
              enum: [created, exists]

    SpeakerMapEntry:
      type: object
      required: [label]
      description: Exactly one of to_person_id, to_name, to_self, to_nobody.
      properties:
        label:
          type: string
        to_person_id:
          type: string
          nullable: true
        to_name:
          type: string
          nullable: true
        to_self:
          type: boolean
          nullable: true
        to_nobody:
          type: boolean
          nullable: true
          description: >
            This label maps to no one. Explicit rather than inferred from
            absent siblings, because this is what REMOVES a presence.

    SpeakerMapRequest:
      type: object
      required: [meeting_id, labels, labels_are_complete]
      properties:
        meeting_id:
          type: string
        labels:
          type: array
          items:
            $ref: "#/components/schemas/SpeakerMapEntry"
        labels_are_complete:
          type: boolean
          description: >
            Must be true. Removal works by absence from the mapping, so a
            partial mapping would delete presence it never described
            (422 INCOMPLETE_MAPPING).

    SpeakerMapResponse:
      type: object
      properties:
        meeting_id:
          type: string
        labels_received:
          type: integer
        appearances_recorded:
          type: integer
        capacities_reduced:
          type: integer
          description: Rows that lost the speaker capacity but survived.
        appearances_removed:
          type: integer
          description: Rows whose only capacity was speaker.
        unresolved_labels:
          type: array
          items:
            type: string
          description: >
            Labels CQ could not resolve. Non-empty means the removal half
            was skipped entirely.
        labels:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              entity_id:
                type: string
                nullable: true
              name:
                type: string
                nullable: true
              patch_id:
                type: string
                nullable: true
              status:
                type: string
                enum: [exists, created, nobody, unresolved]

    Project:
      type: object
      properties:
        project_id:
          type: string
        name:
          type: string
        status:
          type: string
        patch_count:
          type: integer
        created_at:
          type: string
          format: date-time
          nullable: true

    CreateProjectRequest:
      type: object
      required: [project_id, name]
      properties:
        project_id:
          type: string
        name:
          type: string

    CreateProjectResponse:
      type: object
      properties:
        status:
          type: string
          example: created
        project_id:
          type: string

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [active, archived]

    UpdateProjectResponse:
      type: object
      properties:
        status:
          type: string
          example: updated
        project_id:
          type: string

    PrewarmResponse:
      type: object
      properties:
        status:
          type: string
          example: warm
        profile:
          type: boolean
        entities:
          type: integer

    RegisterRequest:
      type: object
      required: [app_name]
      properties:
        app_name:
          type: string

    RegisterResponse:
      type: object
      properties:
        app_id:
          type: string
        app_name:
          type: string
        client_secret:
          type: string
        created_at:
          type: string
          format: date-time

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: bearer
        expires_in:
          type: integer
          example: 3600

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy
        version:
          type: string

paths:
  /v1/recall:
    post:
      operationId: recall
      summary: Intelligent Context Recall
      description: >
        Query the user's quilt for relevant context. Returns a formatted context
        block, matched entity names, and patch count. Designed for the hot path
        — call this before sending a prompt to your LLM.
      tags: [Hot Path]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecallRequest"
      responses:
        "200":
          description: Context recalled successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallResponse"

  /v1/memory:
    post:
      operationId: queueMemory
      summary: Queue Memory Update
      description: >
        Submit an interaction for asynchronous extraction. The request is queued
        immediately and processed by the cold-path worker. Patches are extracted
        and stored without blocking the caller.
      tags: [Memory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryRequest"
      responses:
        "200":
          description: Interaction queued for processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryResponse"

  /v1/enrich:
    post:
      operationId: enrichTemplate
      summary: Template Enrichment
      description: >
        Fill a prompt template with user-specific context variables from the
        quilt. Returns the enriched prompt along with which variables were
        resolved and which were missing.
      tags: [Hot Path]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrichRequest"
      responses:
        "200":
          description: Template enriched successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichResponse"

  /v1/profile/{user_id}:
    get:
      operationId: getProfile
      summary: Get User Profile
      description: Retrieve resolved profile variables for a user.
      tags: [Hot Path]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: keys
          in: query
          required: false
          description: Filter to specific variable keys.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        "200":
          description: Profile retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"

  /v1/quilt/{user_id}:
    get:
      operationId: getQuilt
      summary: Get User's Quilt
      description: >
        Return all active patches (and their connections) for a user. Supports
        delta sync via the `since` query parameter — when provided, only patches
        created or updated after that timestamp are returned, along with a
        `deleted` array of removed patch IDs.
      tags: [Quilt]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: ISO 8601 timestamp for delta sync. Use `server_time` from a previous response.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Quilt patches returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuiltResponse"

    delete:
      operationId: deleteAllUserData
      summary: Delete All User Data (GDPR)
      description: >
        Permanently delete all patches, entities, and relationships for a user.
        Intended for GDPR right-to-erasure compliance.
      tags: [Quilt]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: All user data deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDeleteResponse"

  /v1/quilt/{user_id}/patches:
    post:
      operationId: createPatch
      summary: Create Patch
      description: >
        Manually create a new patch with origin 'declared'. Returns the new
        patch_id so the caller can immediately wire up connections. Optionally
        accepts connections to create in the same call.
      tags: [Quilt]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchCreateRequest"
      responses:
        "200":
          description: Patch created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatchCreateResponse"
        "422":
          description: Invalid patch type.

  /v1/quilt/{user_id}/patches/{patch_id}:
    patch:
      operationId: updatePatch
      summary: Update Patch
      description: Edit a patch's text or category.
      tags: [Quilt]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: patch_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchUpdateRequest"
      responses:
        "200":
          description: Patch updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatchUpdateResponse"

    delete:
      operationId: deletePatch
      summary: Delete Patch
      description: Permanently delete a single patch.
      tags: [Quilt]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: patch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Patch deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatchDeleteResponse"

  /v1/quilt/{user_id}/rename-speaker:
    post:
      operationId: renameSpeaker
      summary: Rename Speaker / Entity
      description: >
        Rename all occurrences of a speaker or entity across the user's patches.
      tags: [Quilt]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameSpeakerRequest"
      responses:
        "200":
          description: Speaker renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenameSpeakerResponse"

  /v1/quilt/{user_id}/reassign-speaker:
    post:
      operationId: reassignSpeaker
      summary: Reassign Speaker
      description: >
        Move one or more diarization labels, in named meetings, to a
        person (by id or by name) or to the submitting user. Records a
        speaker-capacity appearance for each meeting where patches
        actually moved, dated by the meeting rather than by now. See
        docs/architecture/16-people.md 6.2a.
      tags: [Quilt]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignSpeakerRequest"
      responses:
        "200":
          description: Labels reassigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReassignSpeakerResponse"

  /v1/quilt/{user_id}/speaker-map:
    post:
      operationId: setSpeakerMap
      summary: Set Speaker Map
      description: >
        Declare who spoke in a meeting as it now stands and sync presence
        to match. State, not operation: an undo is the post-undo mapping
        and a segment edit is the post-edit mapping. Idempotent. Presence
        only; never rewrites patch owners or text. See
        docs/architecture/16-people.md 6.2a.
      tags: [Quilt]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeakerMapRequest"
      responses:
        "200":
          description: Mapping applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeakerMapResponse"

  /v1/projects/{user_id}:
    get:
      operationId: listProjects
      summary: List Projects
      description: Return all projects for a user with patch counts.
      tags: [Projects]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Projects listed.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"

    post:
      operationId: createProject
      summary: Create Project
      description: Register a new project for a user.
      tags: [Projects]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProjectResponse"

  /v1/projects/{user_id}/{project_id}:
    patch:
      operationId: updateProject
      summary: Update Project
      description: >
        Rename or archive a project. Archiving cascades to all patches in the
        project.
      tags: [Projects]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Project updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateProjectResponse"

  /v1/prewarm:
    post:
      operationId: prewarm
      summary: Cache Prewarm
      description: >
        Warm the Redis working-memory cache for a user before they start a
        session. Reduces first-recall latency.
      tags: [Hot Path]
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cache warmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrewarmResponse"

  /v1/auth/register:
    post:
      operationId: registerApp
      summary: Register Application
      description: >
        Register a new application to obtain an app_id and client_secret for
        authenticating API calls.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Application registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"

  /v1/auth/token:
    post:
      operationId: getToken
      summary: Get Access Token
      description: >
        Exchange app credentials for a short-lived JWT. Uses OAuth2 password
        grant flow where username is the app_id and password is the
        client_secret.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  description: The app_id from registration.
                password:
                  type: string
                  description: The client_secret from registration.
                grant_type:
                  type: string
                  default: password
      responses:
        "200":
          description: Token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"

  /v1/alignment/{user_id}/meetings/{origin_id}:
    get:
      operationId: alignmentForMeeting
      summary: Alignment events a meeting produced
      description: >
        The meeting view's card (Alignment Layer, phase 1). Every shippable
        alignment event this meeting produced, capture order. An empty
        `events` array means no card. Events carry the shared record only;
        the private instruction is never served here.
      tags: [Alignment]
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string } }
        - { name: origin_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Events for the meeting.

  /v1/alignment/{user_id}/projects/{project_id}:
    get:
      operationId: alignmentRecord
      summary: The project's alignment record
      description: >
        Current direction per topic, decision history (the sequence, never
        annotated), awaiting confirmation, direction_change_count and
        cumulative derived impact. Shippable events only.
      tags: [Alignment]
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string } }
        - { name: project_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The record.

  /v1/alignment/{user_id}/events/{event_id}/confirm:
    post:
      operationId: alignmentConfirm
      summary: Confirm a proposed direction
      description: >
        Two-step confirmation: nothing is confirmed by inference. Body
        `confirmed_by` (required, the app vouches) and `on_behalf` (admin
        override, attributed). 409 NOT_CONFIRMABLE on anything but an open
        proposal or correction.
      tags: [Alignment]
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string } }
        - { name: event_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed_by]
              properties:
                confirmed_by: { type: string }
                on_behalf: { type: boolean, default: false }
      responses:
        "200":
          description: Confirmed; returns the event.
        "409":
          description: NOT_CONFIRMABLE.

  /v1/alignment/{user_id}/events/{event_id}/correct:
    post:
      operationId: alignmentCorrect
      summary: Suggest a correction
      description: >
        Corrections are events, not edits. Creates a new `corrected` event
        superseding the proposal; history is append-only. The statement
        passes the shared-text guard (422 SHARED_TEXT_REJECTED). A second
        correction on one proposal is 409 CORRECTION_CONFLICT carrying both;
        CQ never merges.
      tags: [Alignment]
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string } }
        - { name: event_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [statement, reason, corrected_by]
              properties:
                statement: { type: string }
                reason: { type: string }
                corrected_by: { type: string }
                rationale: { type: string, nullable: true }
      responses:
        "200":
          description: The new corrected event.
        "409":
          description: CORRECTION_CONFLICT.
        "422":
          description: SHARED_TEXT_REJECTED.

  /health:
    get:
      operationId: healthCheck
      summary: Health Check
      description: Returns service health status and version.
      tags: [Ops]
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
