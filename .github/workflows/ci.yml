name: CI

# Runs the test suite on PRs and pushes to main. Until this workflow existed,
# nothing ran tests in CI (only deploy.yml shipped to prod), so the
# TEST_DATABASE_URL-gated integration tests had never executed anywhere.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cq_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Make the `contextquilt` package importable (src layout) for tests
          # and the --cov=contextquilt addopt. Test-only tooling is commented
          # out of requirements.txt, so install it explicitly here.
          pip install -e .
          pip install pytest pytest-asyncio pytest-cov

      - name: Unit suite (no DB — DB-gated tests skip via TEST_DATABASE_URL guard)
        run: python -m pytest tests/unit/ -q --junitxml=unit-results.xml

      # A green suite is not the same claim as a suite that ran. pytest
      # already fails an empty selection (bad path exits 4, a filter
      # matching nothing exits 5), but EVERY TEST SKIPPING exits 0, and
      # this suite skips DB-gated tests by design. See the script header.
      - name: Assert the unit tests actually ran
        run: python scripts/assert_tests_ran.py unit-results.xml

      - name: Build fresh schema for integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cq_test
        run: python scripts/run_migrations.py

      # GLOBBED, NOT ENUMERATED, and that change was paid for. This step
      # named three files explicitly, so a fourth DB test added on
      # 2026-08-31 skipped in the no-DB suite and was not selected here:
      # it would never have executed anywhere, which is the only outcome
      # worse than a failing test. The bug it was written for had
      # already happened, and a sabotage run is what exposed that the
      # test could not have caught it.
      #
      # An enumerated list is a list somebody must remember to update,
      # and the entry that gets forgotten is precisely the one whose
      # absence is silent. Every DB-gated file is named `*_db.py`, so
      # the glob is the rule rather than a convenience.
      - name: DB integration tests (every tests/unit/test_*_db.py)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cq_test
        run: python -m pytest tests/unit/test_*_db.py -v --junitxml=db-results.xml

      # And the same count check the unit suite gets, for the same
      # reason: these tests SKIP without TEST_DATABASE_URL, so a typo in
      # the env var name above would turn this step green with nothing
      # exercised, which is exactly the state it was added to detect.
      - name: Assert the DB tests actually ran
        run: python scripts/assert_tests_ran.py db-results.xml
