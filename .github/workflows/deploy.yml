name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Deploy step is operator-specific — it expects secrets pointing at
      # a host running docker-compose.prod.yml from /opt/cq-ops. Forks
      # won't have these and the step skips cleanly.
      - name: Deploy to GCP via SSH
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          passphrase: ${{ secrets.GCP_SSH_PASSPHRASE }}
          script: |
            set -euo pipefail

            cd /opt/contextquilt

            # --- Repo sync ---
            # /opt/contextquilt must be a checked-out git repo. If it
            # isn't (drift recovery), initialize it before pulling.
            if [ ! -d .git ]; then
              echo "WARN: /opt/contextquilt is not a git repo — bootstrapping"
              sudo git init
              sudo git remote add origin https://github.com/${{ github.repository }}.git \
                || sudo git remote set-url origin https://github.com/${{ github.repository }}.git
            fi

            sudo git fetch origin main
            # Hard reset to origin/main to guarantee on-disk init-db/ and
            # scripts/ match the commit that triggered this deploy.
            # Tracked files get overwritten; .gitignored files (.env.prod,
            # .env.mcp) survive.
            sudo git reset --hard origin/main

            # --- Disk headroom check, BEFORE anything writes ---
            # 2026-08-17: the host hit 100% (81MB free of 29GB) and a
            # build died on "unable to fill /var/lib/dpkg/updates/tmp.i
            # with padding", which names dpkg rather than the disk and
            # sent the first look in the wrong direction. A deploy that
            # is going to fail for want of space should say so in those
            # words, before it half-applies anything.
            #
            # Checked before the pull because the pull is the first step
            # that needs room: one image is ~416MB and compose pulls the
            # new one while the old is still referenced.
            AVAIL_MB=$(df -Pm / | awk 'NR==2 {print $4}')
            echo "Disk free: ${AVAIL_MB}MB"
            if [ "$AVAIL_MB" -lt 2048 ]; then
              echo "FATAL: only ${AVAIL_MB}MB free on /. A deploy needs about 2GB."
              echo "Reclaim with: sudo docker builder prune -f   (pure cache, safe)"
              echo "Then:         sudo docker image prune -a -f  (removes rollback targets)"
              exit 1
            fi

            # --- Pull image ---
            # /opt/cq-ops is mode 700 root:root — the compose file and
            # .env.prod live there with restricted perms. Every compose
            # invocation runs through `sudo bash -c "cd /opt/cq-ops &&
            # ..."` so the working directory + reads happen as root.
            # Matches the manual deploy recipe in contextquilt-ops/CLAUDE.md.
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sudo bash -c "cd /opt/cq-ops && docker compose --project-name contextquilt -f docker-compose.prod.yml --env-file .env.prod pull"

            # --- Migrations BEFORE app restart ---
            # The new image is on disk after `compose pull`. Run the
            # tracked migration runner inside a one-shot container from
            # that new image, against the already-running cq-postgres.
            # This must succeed before we restart the app/worker, so the
            # new code never sees a pre-migration schema.
            #
            # Idempotent: runner skips already-applied migrations by
            # filename + sha256 from the schema_migrations table.
            echo "Running migrations…"
            sudo bash -c "cd /opt/cq-ops && docker compose --project-name contextquilt -f docker-compose.prod.yml --env-file .env.prod run --rm --no-deps --entrypoint python context-quilt scripts/run_migrations.py"

            # --- Restart app + worker with new image and migrated schema ---
            sudo bash -c "cd /opt/cq-ops && docker compose --project-name contextquilt -f docker-compose.prod.yml --env-file .env.prod up -d context-quilt context-quilt-worker"

            # --- Smoke test ---
            # The API container only `expose`s 8000 (no host port mapping
            # — it's reachable through Bifrost on the proxy-tier network).
            # So we smoke-test by execing curl inside the container itself,
            # using its own loopback. Wait up to 90s because uvicorn cold
            # start with 4 workers takes ~30s on this VM.
            echo "Smoke-testing /health inside the container…"
            for i in $(seq 1 90); do
              if sudo docker exec contextquilt curl -fsS -o /dev/null http://localhost:8000/health 2>/dev/null; then
                echo "  ✓ /health returned 200 after ${i}s"
                break
              fi
              if [ "$i" -eq 90 ]; then
                echo "ERROR: /health did not return 200 within 90s"
                sudo docker logs --tail=80 contextquilt || true
                exit 1
              fi
              sleep 1
            done

            # --- Reclaim, AFTER the smoke test passes ---
            # Deliberately last. Everything above can still roll back to
            # the previous image; once this runs, the superseded layers
            # may be gone. So it only executes on a deploy that has
            # already proved itself healthy.
            #
            # BUILD CACHE ONLY here. Images are already handled by the
            # `image prune -af --filter until=24h` at the end of this
            # script, and a second image prune would just be two things
            # to keep in step.
            #
            # The build cache was the gap. Nothing in this deploy had
            # ever cleared it, and it was 2.97GB of the 6.7GB reclaimed
            # by hand on 2026-08-17: the single largest category and the
            # fastest-growing. It accrues from every project that builds
            # on this host (GhostPour, Bifrost, the websites) plus any
            # manual build, and it holds nothing that cannot be rebuilt.
            #
            # WHY THE EXISTING 24h FILTER DID NOT SAVE US, which is the
            # part worth remembering: it exempts images younger than a
            # day, and the failure is a BURST. 08-16 had 18 builds and
            # 08-17 had 10, all inside one 24h window, so not one of them
            # qualified while the disk went to 100%. An age filter cannot
            # see a burst; that is what the headroom check above is for.
            #
            # Never fails the deploy: the app is already up and healthy,
            # and housekeeping must not turn a good release into a red X.
            echo "Reclaiming build cache…"
            sudo docker builder prune -f 2>&1 | tail -1 || true
            df -h / | tail -1

            # --- MCP stack (separate compose + env file) ---
            # DISABLED 2026-08-05. Gated off by default rather than
            # deleted, so re-enabling is a variable flip.
            #
            # Why: the MCP deployment was dead and had been for a while.
            # cq-mcp was crash-looping on `ModuleNotFoundError: No module
            # named 'mcp.server.fastmcp'`, so it had never served a request
            # in this image, and its database held zero rows in every
            # table including `applications`, meaning nothing could have
            # authenticated to it anyway. It also had no schema_migrations
            # table at all, so it was not lagging our migrations, it was
            # never tracked against them.
            #
            # It survived this long because `docker ps` showed containers
            # and nobody read further. Restarting it every deploy kept it
            # looking alive.
            #
            # Before re-enabling: bring cq-mcp-postgres up to the current
            # schema (it needs seed_schema_migrations.py first, since the
            # runner refuses an existing-but-unseeded database) and fix the
            # missing mcp dependency in the image. Turning MCP_ENABLED on
            # without both will resurrect a crash loop against a schema
            # that predates migration 29.
            # `--project-name contextquilt` matches the project the running
            # MCP containers were created under (when docker-compose.mcp.yml
            # lived at /opt/contextquilt/). Without it, `cd /opt/cq-ops`
            # makes compose default to project=cq-ops and try to create
            # NEW containers with the same names as the existing MCP ones,
            # which fails on name conflict. The cq-mcp + cq-mcp-worker
            # services use the same image as the main stack, so this
            # pulls/restarts MCP on every deploy — historical behavior.
            # Sudo test because /opt/cq-ops is mode 700.
            # Rendered by Actions before the shell sees it, so an
            # unset variable becomes an empty string rather than
            # tripping `set -u` and failing the whole deploy.
            if [ "${{ vars.MCP_ENABLED }}" = "true" ] \
               && sudo test -f /opt/cq-ops/docker-compose.mcp.yml \
               && sudo test -f /opt/cq-ops/.env.mcp; then
              echo "Syncing MCP stack…"
              # MCP's cq-mcp + cq-mcp-worker use the same GHCR image as
              # the main stack — already pulled (and rate-limit ticked)
              # by the `compose pull` above. The MCP-side pull is just
              # a manifest HEAD against that same image plus refreshes
              # on the public postgres/redis tags. Use
              # --ignore-pull-failures so a transient GHCR auth/rate-
              # limit blip doesn't fail the whole deploy — the local
              # image is current either way, and `up -d` will use it.
              sudo bash -c "cd /opt/cq-ops && docker compose --project-name contextquilt -f docker-compose.mcp.yml --env-file .env.mcp pull --ignore-pull-failures"
              sudo bash -c "cd /opt/cq-ops && docker compose --project-name contextquilt -f docker-compose.mcp.yml --env-file .env.mcp up -d"
            fi

            sudo docker image prune -af --filter "until=24h"
